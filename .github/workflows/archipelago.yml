name: Update archipelago map

on:
  schedule:
    - cron: '43 9 * * *'   # daily, 09:43 UTC, after the Suno count
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: archipelago
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild from public repos and check against git (skips if no repo moved)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/archipelago/update.py "${{ github.repository_owner }}" data/archipelago.json

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/archipelago.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/archipelago.json
          git commit -m "Update archipelago map"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so ask for a rebuild.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Pages build request failed; the next push will publish the map."
